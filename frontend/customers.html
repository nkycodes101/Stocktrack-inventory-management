<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopTrack | Customers</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="dashboard-body">
    <div class="workspace-strip">
      <div class="workspace-picker">
        <span class="workspace-label">Workspace:</span>
        <select id="workspaceSelector" class="workspace-select" aria-label="Workspace selector">
          <option value="Main Store">Main Store</option>
          <option value="Branch 1">Branch 1</option>
          <option value="Branch 2">Branch 2</option>
        </select>
      </div>
    </div>
    <div class="dashboard-app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="logo-badge small">S</div>
          <div>
            <h2>ShopTrack</h2>
          </div>
        </div>

        <nav class="sidebar-nav" aria-label="Main navigation">
          <a href="dashboard.html" class="nav-item"><span class="nav-icon">▣</span>Dashboard</a>
          <a href="products.html" class="nav-item"><span class="nav-icon">◫</span>Products</a>
          <a href="suppliers.html" class="nav-item"><span class="nav-icon">◍</span>Suppliers</a>
          <a href="inventory.html" class="nav-item"><span class="nav-icon">▤</span>Inventory</a>
          <a href="sales.html" class="nav-item"><span class="nav-icon">◌</span>Sales</a>
          <a href="customers.html" class="nav-item active"><span class="nav-icon">◎</span>Customers</a>
          <a href="reports.html" class="nav-item"><span class="nav-icon">▥</span>Reports</a>
          <a href="assistant.html" class="nav-item assistant-link"><span class="nav-icon">✦</span>Smart Assistant</a>
          <a href="settings.html" class="nav-item"><span class="nav-icon">⚙</span>Settings</a>
        </nav>

        <div class="sidebar-footer">
          <a href="login.html" class="nav-item logout">Logout</a>
        </div>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <div class="topbar-left">
            <button type="button" class="menu-toggle" id="menuToggle" aria-label="Open menu">☰</button>
            <h1>Customers</h1>
          </div>

          <div class="topbar-right">
            <div class="search-box">
              <span class="search-icon">⌕</span>
              <input type="search" id="customerSearch" placeholder="Search customer" aria-label="Search customer" />
            </div>

            <button type="button" class="icon-button" aria-label="Notifications">🔔</button>

            <div class="user-panel" aria-label="User account">
              <div class="avatar">BO</div>
              <div class="user-text">
                <strong>Business Owner</strong>
                <small>Admin</small>
              </div>
            </div>
          </div>
        </header>

        <main class="content-area">
          <section class="toolbar-box">
            <div class="toolbar-filters">
              <input type="text" id="customerNameInput" placeholder="Customer name" aria-label="Customer name" />
              <input type="tel" id="customerPhoneInput" placeholder="Phone number" aria-label="Phone number" />
            </div>
            <button type="button" class="primary-btn small-btn" id="openCustomerModalBtn">+ Add Customer</button>
          </section>

          <section class="panel page-panel">
            <div class="panel-header">
              <h3>Customer Directory</h3>
              <span class="panel-tag">Active contacts</span>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Total Purchases</th>
                    <th>Amount Owed</th>
                    <th>Last Purchase</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="customersTableBody"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div class="modal hidden" id="customerModal" aria-hidden="true">
      <div class="modal-backdrop" data-close-customer="true"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="customerModalTitle">
        <div class="modal-header">
          <h3 id="customerModalTitle">Add Customer</h3>
          <button type="button" class="modal-close" aria-label="Close customer modal" data-close-customer="true">×</button>
        </div>

        <form id="customerForm" class="product-form">
          <div class="form-grid">
            <div class="field-group full-span">
              <label for="customerNameField">Customer Name</label>
              <input type="text" id="customerNameField" name="customerNameField" required />
            </div>

            <div class="field-group full-span">
              <label for="customerPhoneField">Phone Number</label>
              <input type="tel" id="customerPhoneField" name="customerPhoneField" required />
            </div>
          </div>

          <div id="customerFormMessage" class="form-message" aria-live="polite"></div>

          <div class="modal-actions">
            <button type="button" class="secondary-btn" data-close-customer="true">Cancel</button>
            <button type="submit" class="primary-btn small-btn">Save Customer</button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/customers.js"></script>
  </body>
</html>
