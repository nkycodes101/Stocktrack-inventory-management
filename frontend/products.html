<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopTrack | Products</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="dashboard-body">
    <div class="workspace-strip">
      <div class="workspace-picker">
        <span class="workspace-label">Workspace:</span>
        <select id="workspaceSelector" class="workspace-select" aria-label="Workspace selector">
          <option value="Main Store">Main Store</option>
          <option value="Branch 1">Branch 1</option>
          <option value="Branch 2">Branch 2</option>
        </select>
      </div>
    </div>
    <div class="dashboard-app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="logo-badge small">S</div>
          <div>
            <h2>ShopTrack</h2>
          </div>
        </div>

        <nav class="sidebar-nav" aria-label="Main navigation">
          <a href="dashboard.html" class="nav-item"><span class="nav-icon">▣</span>Dashboard</a>
          <a href="products.html" class="nav-item active"><span class="nav-icon">◫</span>Products</a>
          <a href="suppliers.html" class="nav-item"><span class="nav-icon">◍</span>Suppliers</a>
          <a href="inventory.html" class="nav-item"><span class="nav-icon">▤</span>Inventory</a>
          <a href="sales.html" class="nav-item"><span class="nav-icon">◌</span>Sales</a>
          <a href="customers.html" class="nav-item"><span class="nav-icon">◎</span>Customers</a>
          <a href="reports.html" class="nav-item"><span class="nav-icon">▥</span>Reports</a>
          <a href="assistant.html" class="nav-item assistant-link"><span class="nav-icon">✦</span>Smart Assistant</a>
          <a href="settings.html" class="nav-item"><span class="nav-icon">⚙</span>Settings</a>
        </nav>

        <div class="sidebar-footer">
          <a href="login.html" class="nav-item logout">Logout</a>
        </div>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <div class="topbar-left">
            <button type="button" class="menu-toggle" id="menuToggle" aria-label="Open menu">☰</button>
            <h1>Products</h1>
          </div>

          <div class="topbar-right">
            <div class="search-box">
              <span class="search-icon">⌕</span>
              <input type="search" id="productSearch" placeholder="Search products" aria-label="Search products" />
            </div>

            <button type="button" class="icon-button" aria-label="Notifications">🔔</button>

            <div class="user-panel" aria-label="User account">
              <div class="avatar">BO</div>
              <div class="user-text">
                <strong>Business Owner</strong>
                <small>Admin</small>
              </div>
            </div>
          </div>
        </header>

        <main class="content-area">
          <section class="toolbar-box">
            <div class="toolbar-filters">
              <select id="categoryFilter" aria-label="Filter by category">
                <option value="All">All Categories</option>
                <option value="Beverages">Beverages</option>
                <option value="Food">Food</option>
                <option value="Household">Household</option>
                <option value="Personal Care">Personal Care</option>
              </select>

              <select id="statusFilter" aria-label="Filter by status">
                <option value="All">All Status</option>
                <option value="In Stock">In Stock</option>
                <option value="Low Stock">Low Stock</option>
                <option value="Out of Stock">Out of Stock</option>
              </select>
            </div>

            <button type="button" class="primary-btn small-btn" id="openProductModalBtn">+ Add Product</button>
          </section>

          <section class="panel page-panel">
            <div class="panel-header">
              <h3>Product List</h3>
              <span class="panel-tag" id="productsCountLabel">0 items</span>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Product</th>
                    <th>Category</th>
                    <th>Variant</th>
                    <th>SKU</th>
                    <th>Cost</th>
                    <th>Wholesale</th>
                    <th>Retail</th>
                    <th>Opening Qty</th>
                    <th>Threshold</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="productsTableBody"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div class="modal hidden" id="productModal" aria-hidden="true">
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="productModalTitle">
        <div class="modal-header">
          <h3 id="productModalTitle">Add Product</h3>
          <button type="button" class="modal-close" aria-label="Close modal" data-close="true">×</button>
        </div>

        <form id="productForm" class="product-form">
          <div class="form-grid">
            <div class="field-group">
              <label for="productName">Product Name</label>
              <input type="text" id="productName" name="productName" required />
            </div>

            <div class="field-group">
              <label for="productCategory">Category</label>
              <input type="text" id="productCategory" name="productCategory" required />
            </div>

            <div class="field-group">
              <label for="productVariant">Variant</label>
              <input type="text" id="productVariant" name="productVariant" required />
            </div>

            <div class="field-group">
              <label for="productSku">SKU</label>
              <input type="text" id="productSku" name="productSku" required />
            </div>

            <div class="field-group">
              <label for="costPrice">Cost Price</label>
              <input type="number" id="costPrice" name="costPrice" min="0" step="0.01" required />
            </div>

            <div class="field-group">
              <label for="wholesalePrice">Wholesale Price</label>
              <input type="number" id="wholesalePrice" name="wholesalePrice" min="0" step="0.01" required />
            </div>

            <div class="field-group">
              <label for="retailPrice">Retail Price</label>
              <input type="number" id="retailPrice" name="retailPrice" min="0" step="0.01" required />
            </div>

            <div class="field-group">
              <label for="openingQuantity">Opening Quantity</label>
              <input type="number" id="openingQuantity" name="openingQuantity" min="0" step="1" required />
            </div>

            <div class="field-group">
              <label for="lowStockThreshold">Low Stock Threshold</label>
              <input type="number" id="lowStockThreshold" name="lowStockThreshold" min="0" step="1" required />
            </div>
          </div>

          <div id="productFormMessage" class="form-message" aria-live="polite"></div>

          <div class="modal-actions">
            <button type="button" class="secondary-btn" data-close="true">Cancel</button>
            <button type="submit" class="primary-btn small-btn">Save Product</button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/products.js"></script>
  </body>
</html>
