<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopTrack | Settings</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="dashboard-body">
    <div class="workspace-strip">
      <div class="workspace-picker">
        <span class="workspace-label">Workspace:</span>
        <select id="workspaceSelector" class="workspace-select" aria-label="Workspace selector">
          <option value="Main Store">Main Store</option>
          <option value="Branch 1">Branch 1</option>
          <option value="Branch 2">Branch 2</option>
        </select>
      </div>
    </div>
    <div class="dashboard-app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="logo-badge small">S</div>
          <div>
            <h2>ShopTrack</h2>
          </div>
        </div>

        <nav class="sidebar-nav" aria-label="Main navigation">
          <a href="dashboard.html" class="nav-item"><span class="nav-icon">▣</span>Dashboard</a>
          <a href="products.html" class="nav-item"><span class="nav-icon">◫</span>Products</a>
          <a href="suppliers.html" class="nav-item"><span class="nav-icon">◍</span>Suppliers</a>
          <a href="inventory.html" class="nav-item"><span class="nav-icon">▤</span>Inventory</a>
          <a href="sales.html" class="nav-item"><span class="nav-icon">◌</span>Sales</a>
          <a href="customers.html" class="nav-item"><span class="nav-icon">◎</span>Customers</a>
          <a href="reports.html" class="nav-item"><span class="nav-icon">▥</span>Reports</a>
          <a href="assistant.html" class="nav-item assistant-link"><span class="nav-icon">✦</span>Smart Assistant</a>
          <a href="settings.html" class="nav-item active"><span class="nav-icon">⚙</span>Settings</a>
        </nav>

        <div class="sidebar-footer">
          <a href="login.html" class="nav-item logout">Logout</a>
        </div>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <div class="topbar-left">
            <button type="button" class="menu-toggle" id="menuToggle" aria-label="Open menu">☰</button>
            <h1>Settings</h1>
          </div>

          <div class="topbar-right">
            <div class="search-box">
              <span class="search-icon">⌕</span>
              <input type="search" placeholder="Search settings" aria-label="Search settings" />
            </div>

            <button type="button" class="icon-button" aria-label="Notifications">🔔</button>

            <div class="user-panel" aria-label="User account">
              <div class="avatar">BO</div>
              <div class="user-text">
                <strong>Business Owner</strong>
                <small>Admin</small>
              </div>
            </div>
          </div>
        </header>

        <main class="content-area">
          <section class="panel page-panel">
            <div class="panel-header">
              <h3>Business Settings</h3>
            </div>

            <div class="form-grid">
              <div class="field-group">
                <label for="businessName">Business Name</label>
                <input type="text" id="businessName" value="ShopTrack Retail" />
              </div>

              <div class="field-group">
                <label for="currency">Currency</label>
                <select id="currency">
                  <option value="NGN" selected>NGN</option>
                  <option value="USD">USD</option>
                </select>
              </div>
            </div>
          </section>

          <section class="panel page-panel">
            <div class="panel-header">
              <h3>Preferences</h3>
            </div>

            <div class="settings-list">
              <label class="check-row"><input type="checkbox" checked /> <span>Enable low-stock alerts</span></label>
              <label class="check-row"><input type="checkbox" checked /> <span>Auto-save sales history</span></label>
              <label class="check-row"><input type="checkbox" checked /> <span>Show expiry reminders</span></label>
            </div>

            <div class="modal-actions">
              <button type="button" class="secondary-btn" id="resetSettingsBtn">Reset</button>
              <button type="button" class="primary-btn small-btn" id="saveSettingsBtn">Save Settings</button>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/settings.js"></script>
  </body>
</html>
